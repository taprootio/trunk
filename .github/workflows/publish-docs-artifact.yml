name: Publish Docs artifact

on:
  push:
    tags:
      - "docs-artifact-v*"

concurrency:
  # Prevent overlapping publishes and retain queued runs. The monotonic guard
  # below fails closed because GitHub does not guarantee semantic tag order.
  group: docs-artifact-npm
  queue: max
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    name: Publish @taprootio/docs-artifact
    runs-on: ubuntu-latest
    environment: npm-docs-artifact-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Require the release commit to belong to main
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Setup Node for npm trusted publishing
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/

      - name: Upgrade npm for trusted publishing
        run: npm install --global npm@12.0.2

      - name: Require the release tag and public repository metadata to match
        working-directory: packages/docs-artifact
        run: |
          package_version="$(node -p "require('./package.json').version")"
          repository_url="$(node -p "require('./package.json').repository.url")"
          repository_directory="$(node -p "require('./package.json').repository.directory")"
          test "$GITHUB_REF_NAME" = "docs-artifact-v${package_version}"
          test "$repository_url" = "https://github.com/taprootio/trunk.git"
          test "$repository_directory" = "packages/docs-artifact"

      - name: Test package and conformance fixtures
        run: npm test

      - name: Enforce release order and detect an identical completed npm publish
        id: registry
        working-directory: packages/docs-artifact
        shell: bash
        run: |
          set -euo pipefail
          package_name="$(node -p "require('./package.json').name")"
          package_version="$(node -p "require('./package.json').version")"
          package_spec="${package_name}@${package_version}"
          versions_file="$RUNNER_TEMP/docs-artifact-versions.json"
          versions_error="$RUNNER_TEMP/docs-artifact-versions.error"
          if ! npm view "$package_name" versions --json --registry=https://registry.npmjs.org/ > "$versions_file" 2> "$versions_error"; then
            if grep -q "E404" "$versions_error"; then
              echo "[]" > "$versions_file"
            else
              cat "$versions_error" >&2
              exit 1
            fi
          fi
          node ../../scripts/npm-release-guard.mjs order "$package_version" "$versions_file"

          integrity_file="$RUNNER_TEMP/docs-artifact-integrity.txt"
          integrity_error="$RUNNER_TEMP/docs-artifact-integrity.error"
          if npm view "$package_spec" dist.integrity --registry=https://registry.npmjs.org/ > "$integrity_file" 2> "$integrity_error"; then
            published_integrity="$(tr -d '\r\n' < "$integrity_file")"
            test -n "$published_integrity"
            npm pack --json --ignore-scripts --pack-destination "$RUNNER_TEMP" > "$RUNNER_TEMP/docs-artifact-pack.json"
            local_integrity="$(node -p "JSON.parse(require('node:fs').readFileSync(process.argv[1], 'utf8'))[0].integrity" "$RUNNER_TEMP/docs-artifact-pack.json")"
            test "$local_integrity" = "$published_integrity"

            audit_directory="$RUNNER_TEMP/docs-artifact-provenance"
            mkdir -p "$audit_directory"
            npm install --prefix "$audit_directory" --ignore-scripts --no-audit --no-fund --save-exact "$package_spec"
            npm --prefix "$audit_directory" audit signatures --json --include-attestations > "$RUNNER_TEMP/docs-artifact-attestations.json"
            node ../../scripts/npm-release-guard.mjs provenance \
              "$RUNNER_TEMP/docs-artifact-attestations.json" \
              "$package_name" \
              "$package_version" \
              "https://github.com/taprootio/trunk" \
              ".github/workflows/publish-docs-artifact.yml" \
              "refs/tags/$GITHUB_REF_NAME" \
              "$GITHUB_SHA"
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
            echo "$package_spec already exists with identical package integrity and verified Trunk provenance."
          else
            if grep -q "E404" "$integrity_error"; then
              echo "should_publish=true" >> "$GITHUB_OUTPUT"
            else
              cat "$integrity_error" >&2
              exit 1
            fi
          fi

      - name: Publish immutable public package with provenance
        if: steps.registry.outputs.should_publish == 'true'
        working-directory: packages/docs-artifact
        env:
          # Keep this after deleting NPM_TOKEN: an empty token lets npm's OIDC
          # trusted publishing replace the setup-node registry configuration.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public --provenance
