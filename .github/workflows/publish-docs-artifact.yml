name: Publish Docs artifact

on:
  push:
    tags:
      - "docs-artifact-v*"

concurrency:
  # Prevent overlapping publishes and retain queued runs. The monotonic guard
  # below fails closed because GitHub does not guarantee semantic tag order.
  group: docs-artifact-npm
  queue: max
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    name: Publish @taprootio/docs-artifact
    runs-on: ubuntu-latest
    environment: npm-docs-artifact-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Require the release commit to belong to main
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Setup Node for npm trusted publishing
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/

      - name: Upgrade npm for trusted publishing
        run: npm install --global npm@12.0.2

      - name: Require the release tag and public repository metadata to match
        working-directory: packages/docs-artifact
        run: |
          package_version="$(node -p "require('./package.json').version")"
          repository_url="$(node -p "require('./package.json').repository.url")"
          repository_directory="$(node -p "require('./package.json').repository.directory")"
          test "$GITHUB_REF_NAME" = "docs-artifact-v${package_version}"
          test "$repository_url" = "https://github.com/taprootio/trunk.git"
          test "$repository_directory" = "packages/docs-artifact"

      - name: Test artifact, conformance fixtures, and shared release guards
        run: |
          npm --prefix packages/docs-artifact test
          npm --prefix packages/docs-artifact run conformance
          npm --prefix packages/docs-artifact run conformance:prebuilt
          npm run test:release-guards

      - name: Enforce release order and detect an identical completed npm publish
        id: registry
        working-directory: packages/docs-artifact
        run: node ../../scripts/npm-release.mjs inspect .github/workflows/publish-docs-artifact.yml

      - name: Publish immutable public package with provenance
        if: steps.registry.outputs.should_publish == 'true'
        working-directory: packages/docs-artifact
        env:
          # Keep this after deleting NPM_TOKEN: an empty token lets npm's OIDC
          # trusted publishing replace the setup-node registry configuration.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: node ../../scripts/npm-release.mjs publish
